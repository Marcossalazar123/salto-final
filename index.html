<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salto Final</title>
<style>
:root{
  --img-fundo: url("1794754186995.png");
  --cor-dourado: #ffc107;
  --cor-botao: #ff9f00;
  --cor-fundo-caixa: rgba(0,0,0,0.75);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
html,body{width:100%;height:100%;overflow:hidden;}
.tela{
  position:fixed;inset:0;
  background:#000 no-repeat center center;
  background-size:cover;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  transition:opacity 0.5s ease;
}
.escondida{opacity:0;pointer-events:none;}

/* Tela 1 - Carregando */
#tela1{background-image:var(--img-fundo);z-index:40;}
.caixa-centro, .caixa-form{
  background:var(--cor-fundo-caixa);padding:40px;border-radius:20px;
  border:3px solid var(--cor-dourado);text-align:center;color:white;
}
.texto-carr{font-size:2.2rem;color:var(--cor-dourado);margin-bottom:25px;font-weight:bold;}
.barra-base{width:240px;height:24px;background:#333;border-radius:12px;border:2px solid var(--cor-dourado);margin-bottom:10px;overflow:hidden;}
.barra-topo{height:100%;width:0%;background:linear-gradient(90deg,var(--cor-dourado),var(--cor-botao));border-radius:10px;transition:width 0.05s linear;}
.porcento{font-size:1.1rem;margin-bottom:20px;}

/* Tela 2 - Começar */
#tela2{background-image:var(--img-fundo);z-index:30;}
.texto-pronto{font-size:2.5rem;color:white;text-shadow:2px 2px 4px rgba(0,0,0,0.8);margin-bottom:30px;font-weight:bold;}
.btn{
  padding:15px 50px;font-size:1.5rem;
  background:linear-gradient(to bottom,var(--cor-dourado),var(--cor-botao));
  color:#000;font-weight:bold;border:none;border-radius:10px;
  cursor:pointer;border:2px solid #000;transition:transform 0.2s;
}
.btn:hover{transform:scale(1.05);}

/* Tela 3 - Nome */
#tela3{background-image:var(--img-fundo);z-index:20;}
.caixa-form{width:90%;max-width:400px;padding:35px;}
.titulo-form{font-size:1.6rem;color:var(--cor-dourado);margin-bottom:25px;}
.label{font-size:1.2rem;margin-bottom:10px;display:block;}
.input{
  width:100%;padding:12px;font-size:1.1rem;
  background:#222;color:white;border:2px solid #555;
  border-radius:8px;margin-bottom:20px;outline:none;
}
.input:focus{border-color:var(--cor-dourado);}

/* Tela 4 - Escolher Personagem */
#tela4{background-image:var(--img-fundo);z-index:10;}
.titulo-pers{font-size:1.8rem;color:var(--cor-dourado);margin-bottom:30px;text-align:center;}
.opcoes{display:flex;gap:30px;margin-bottom:30px;}
.opcao{
  width:150px;height:150px;background:var(--cor-fundo-caixa);
  border:3px solid #555;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  color:white;cursor:pointer;transition:border-color 0.2s;
  font-size:1.2rem;font-weight:bold;
}
.opcao.selecionado{border-color:var(--cor-dourado);box-shadow:0 0 15px var(--cor-dourado);}
.aviso{color:#ff6666;margin-top:15px;display:none;}

/* Tela 5 - Lobby */
#tela5{
  background-image:var(--img-fundo);z-index:5;
  background-size:cover;background-position:center center;
}
.personagem-lobby{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:3rem;color:white;font-weight:bold;
  text-shadow:2px 2px 6px rgba(0,0,0,0.9);
  z-index:10;
}
.btn-iniciar{
  position:absolute;bottom:30px;right:30px;
  padding:12px 30px;font-size:1.1rem;
  background:linear-gradient(to bottom,var(--cor-dourado),var(--cor-botao));
  color:#000;font-weight:bold;border:none;border-radius:8px;
  cursor:pointer;border:2px solid #000;z-index:10;
}
</style>
</head>
<body>

<div id="tela1" class="tela">
  <div class="caixa-centro">
    <div class="texto-carr">Carregando...</div>
    <div class="barra-base"><div id="barra" class="barra-topo"></div></div>
    <div class="porcento" id="perc">0%</div>
  </div>
</div>

<div id="tela2" class="tela escondida">
  <div class="texto-pronto">PRONTO!</div>
  <button class="btn" id="btnComecar">COMEÇAR</button>
</div>

<div id="tela3" class="tela escondida">
  <div class="caixa-form">
    <h2 class="titulo-form">Digite seu nome</h2>
    <label class="label">Seu nome:</label>
    <input type="text" id="nomeJogador" class="input" placeholder="Digite aqui...">
    <button class="btn" id="btnNome">CONTINUAR</button>
  </div>
</div>

<div id="tela4" class="tela escondida">
  <h2 class="titulo-pers">Escolha seu personagem</h2>
  <div class="opcoes">
    <div class="opcao" data-pers="Masculino">Masculino</div>
    <div class="opcao" data-pers="Feminino">Feminino</div>
  </div>
  <button class="btn" id="btnEntrar">ENTRAR NO LOBBY</button>
  <p class="aviso" id="aviso">Escolha um personagem primeiro!</p>
</div>

<div id="tela5" class="tela escondida">
  <div class="personagem-lobby" id="personagemLobby"></div>
  <button class="btn-iniciar">INICIAR PARTIDA</button>
</div>

<script>
let tipoPersonagem = "";

function proxima(esconde, mostra){
  document.getElementById(esconde).classList.add('escondida');
  document.getElementById(mostra).classList.remove('escondida');
}

const barra = document.getElementById('barra');
const perc = document.getElementById('perc');
let p = 0;
const carregar = setInterval(()=>{
  p++; barra.style.width = p+'%'; perc.textContent = p+'%';
  if(p>=100){ clearInterval(carregar); proxima('tela1','tela2'); }
},40);

document.getElementById('btnComecar').onclick = ()=> proxima('tela2','tela3');

document.getElementById('btnNome').onclick = ()=>{
  const nome = document.getElementById('nomeJogador').value.trim();
  if(nome) proxima('tela3','tela4');
  else alert('Digite seu nome primeiro!');
};

document.querySelectorAll('.opcao').forEach(op=>{
  op.onclick = ()=>{
    document.querySelectorAll('.opcao').forEach(x=>x.classList.remove('selecionado'));
    op.classList.add('selecionado');
    tipoPersonagem = op.dataset.pers;
    document.getElementById('aviso').style.display = 'none';
  };
});

document.getElementById('btnEntrar').onclick = ()=>{
  if(tipoPersonagem){
    document.getElementById('personagemLobby').textContent = tipoPersonagem;
    proxima('tela4','tela5');
  }else{
    document.getElementById('aviso').style.display = 'block';
  }
};
</script>

</body>
</html>
