<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salto Final</title>
<style>
:root{
  --fundo-abertura:url("1794754186995.png");
  --fundo-lobby:url("1794757547687.png");
  --cor-dourado:#ffc107;
  --cor-ouro:#ffd700;
  --cor-diamante:#00d4ff;
  --cor-botao:#ff9f00;
  --cor-fundo:rgba(0,0,0,0.75);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}
html,body{width:100%;height:100%;overflow:hidden;}

.tela{
  position:fixed;inset:0;
  background:#000 no-repeat center/cover;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  transition:opacity 0.5s ease;
}

/* -- Tela de Abertura / Carregamento -- */
#abertura{background-image:var(--fundo-abertura);z-index:10;}
#abertura .sombra{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.7));}
#abertura .conteudo{position:relative;z-index:1;text-align:center;color:#fff;padding:20px;}
#abertura h1{font-size:clamp(36px,10vw,72px);color:var(--cor-dourado);text-shadow:0 0 20px rgba(255,193,7,0.5);margin-bottom:20px;}
.cx-nome{background:rgba(0,0,0,0.6);border:2px solid var(--cor-dourado);border-radius:12px;padding:25px;margin:15px auto;max-width:400px;width:90%;}
.cx-nome input{width:100%;padding:14px;font-size:18px;border-radius:8px;border:none;outline:none;text-align:center;margin-bottom:15px;background:#222;color:#fff;}
button{padding:14px 40px;font-size:20px;font-weight:bold;border:none;border-radius:8px;background:linear-gradient(180deg,#ffc107,#ff9f00);color:#000;cursor:pointer;transition:transform 0.15s, box-shadow 0.15s;box-shadow:0 4px 0 #b37700;}
button:active{transform:translateY(4px);box-shadow:none;}
.oculto{display:none !important;opacity:0;pointer-events:none;}

/* -- Tela de Escolha de Personagem -- */
#escolha{background:linear-gradient(180deg,#1a1a2e,#16213e);z-index:5;}
#escolha h2{color:var(--cor-dourado);font-size:clamp(24px,6vw,42px);margin-bottom:30px;}
.personagens{display:flex;gap:30px;flex-wrap:wrap;justify-content:center;padding:20px;}
.card-personagem{background:rgba(255,255,255,0.05);border:3px solid #444;border-radius:16px;padding:30px;cursor:pointer;transition:all 0.3s ease;text-align:center;min-width:160px;}
.card-personagem:hover{border-color:var(--cor-dourado);transform:scale(1.05);box-shadow:0 0 25px rgba(255,193,7,0.25);}
.card-personagem img{width:120px;height:160px;object-fit:contain;margin-bottom:15px;}
.card-personagem h3{color:#fff;font-size:20px;}

/* -- Lobby Principal -- */
#lobby{background-image:var(--fundo-lobby);z-index:1;}
.barra-topo{
  position:absolute;top:0;left:0;right:0;
  padding:12px 20px;
  display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
  color:#fff;
}
.recursos{display:flex;gap:20px;}
.item-recurso{display:flex;align-items:center;gap:6px;font-weight:bold;}
.ouro{color:var(--cor-ouro);}
.diamante{color:var(--cor-diamante);}
.nome-jogador{font-size:20px;font-weight:bold;color:var(--cor-dourado);text-shadow:0 2px 4px #000;}

/* Personagem no centro do Lobby */
.personagem-centro{
  position:absolute;bottom:15%;left:50%;transform:translateX(-50%);
  text-align:center;
}
.personagem-centro img{
  width:180px;height:auto;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,0.6));
}
.personagem-centro .nome{
  color:#fff;font-size:22px;font-weight:bold;margin-top:8px;
  text-shadow:0 2px 6px #000;
}

/* Botões laterais */
.barra-esquerda{
  position:absolute;left:15px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:12px;
}
.barra-esquerda button{
  padding:10px 16px;font-size:15px;background:rgba(0,0,0,0.6);
  color:#fff;border:2px solid #555;box-shadow:none;
  border-radius:8px;
}
.barra-esquerda button:hover{border-color:var(--cor-dourado);background:rgba(0,0,0,0.8);}

.botao-jogar{
  position:absolute;right:8%;bottom:18%;
  padding:18px 50px;font-size:24px;
  background:linear-gradient(180deg,#ffc107,#ff8c00);
  border-radius:10px;
}
</style>
</head>
<body>

<!-- === TELA 1: Abertura / Digitar NOME === -->
<div id="abertura" class="tela">
  <div class="sombra"></div>
  <div class="conteudo">
    <h1>SALTO FINAL</h1>
    <div class="cx-nome">
      <label style="color:#fff;font-size:18px;">Digite seu nome de jogador:</label>
      <input type="text" id="campoNome" placeholder="Seu nome aqui..." maxlength="12">
      <button onclick="irParaEscolha()">CONTINUAR</button>
    </div>
  </div>
</div>

<!-- === TELA 2: Escolha de Personagem === -->
<div id="escolha" class="tela oculto">
  <h2>Escolha seu Personagem</h2>
  <div class="personagens">
    <div class="card-personagem" onclick="escolherPersonagem('masculino')">
      <div style="font-size:80px;color:#4CAF50;margin-bottom:10px;">🧍‍♂️</div>
      <h3>Masculino</h3>
    </div>
    <div class="card-personagem" onclick="escolherPersonagem('feminino')">
      <div style="font-size:80px;color:#03A9F4;margin-bottom:10px;">🧍‍♀️</div>
      <h3>Feminino</h3>
    </div>
  </div>
</div>

<!-- === TELA 3: Lobby Principal === -->
<div id="lobby" class="tela oculto">
  <!-- Barra de cima: Recursos e Nome -->
  <div class="barra-topo">
    <div class="recursos">
      <div class="item-recurso ouro">💰 2.500</div>
      <div class="item-recurso diamante">💎 150</div>
    </div>
    <div class="nome-jogador" id="mostrarNome">Jogador</div>
    <div style="font-size:14px;">Saldo Final</div>
  </div>

  <!-- Lado esquerdo: Outras opções -->
  <div class="barra-esquerda">
    <button>🏪 Loja</button>
    <button>🎰 Roleta</button>
    <button>🎫 Passe de Batalha</button>
    <button>👤 Perfil</button>
    <button>⚙️ Configurações</button>
  </div>

  <!-- Personagem no centro embaixo -->
  <div class="personagem-centro" id="personagemNoLobby">
    <div style="font-size:100px;" id="iconePersonagem">🧍‍♂️</div>
    <div class="nome" id="nomePersonagem">Jogador</div>
  </div>

  <!-- Botão Jogar à direita embaixo -->
  <button class="botao-jogar">🎮 INICIAR PARTIDA</button>
</div>

<script>
let nomeJogador = "";
let tipoPersonagem = "";

function irParaEscolha(){
  const input = document.getElementById("campoNome");
  nomeJogador = input.value.trim();
  if(nomeJogador === ""){
    alert("Por favor, digite seu nome!");
    return;
  }
  // Salva o nome e vai para escolha
  document.getElementById("abertura").classList.add("oculto");
  document.getElementById("escolha").classList.remove("oculto");
}

function escolherPersonagem(tipo){
  tipoPersonagem = tipo;
  // Atualiza o lobby com os dados
  document.getElementById("mostrarNome").textContent = nomeJogador;
  document.getElementById("nomePersonagem").textContent = nomeJogador;
  
  if(tipo === "masculino"){
    document.getElementById("iconePersonagem").textContent = "🧍‍♂️";
  } else {
    document.getElementById("iconePersonagem").textContent = "🧍‍♀️";
  }
  
  // Vai para o Lobby
  document.getElementById("escolha").classList.add("oculto");
  document.getElementById("lobby").classList.remove("oculto");
}
</script>

</body>
</html>
