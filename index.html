<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salto Final</title>
    <style>
:root{
  --img-carregamento:url("1794754186995.png");   /* sua imagem de fundo de carregando */
  --img-comecar:url("1794757547687.png");          /* sua imagem com COMEÇAR */
  --cor-dourado:#ffc107;
  --cor-botao:#ff9f00;
  --cor-fundo:rgba(0,0,0,0.75);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
html,body{width:100%;height:100%;overflow:hidden;}

.tela{
  position:fixed;inset:0;
  background:#000 no-repeat center/cover;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  transition:opacity 0.5s ease;
}

.escondida{opacity:0;pointer-events:none;}

/* === TELA 1: CARREGAMENTO === */
#tela-carregamento{
  background-image:var(--img-carregamento);
  z-index:40;
}

.carregamento-box{
  text-align:center;color:white;
  background:var(--cor-fundo);
  padding:40px;border-radius:20px;
  border:3px solid var(--cor-dourado);
}

.texto-carregando{
  font-size:2.5rem;color:var(--cor-dourado);
  margin-bottom:30px;font-weight:bold;
}

.barra-fundo{
  width:250px;height:25px;
  background:#333;border-radius:13px;
  border:2px solid var(--cor-dourado);
  margin-bottom:10px;overflow:hidden;
}

.barra-progresso{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--cor-dourado),var(--cor-botao));
  border-radius:10px;
  transition:width 0.05s linear;
}

.porcentagem{
  font-size:1.2rem;color:white;margin-bottom:20px;
}

/* === TELA 2: BOTÃO COMEÇAR === */
#tela-comecar{
  background-image:url("1794757547687.png");
  z-index:30;
}

.texto-pronto{
  font-size:2.5rem;color:white;
  text-shadow:2px 2px 4px rgba(0,0,0,0.8);
  margin-bottom:20px;font-weight:bold;
}

.botao-comecar{
  padding:18px 60px;font-size:1.8rem;
  background:linear-gradient(to bottom,var(--cor-dourado),var(--cor-botao));
  color:#000;font-weight:bold;border:none;
  border-radius:10px;cursor:pointer;
  border:2px solid #000;box-shadow:0 4px 10px rgba(0,0,0,0.5);
  transition:transform 0.2s;
}
.botao-comecar:hover{transform:scale(1.05);}

/* === TELA 3: DIGITAR NOME === */
#tela-nome{
  background-image:url("1794757547687.png");
  z-index:20;
}

.caixa-form{
  background:var(--cor-fundo);padding:35px;border-radius:15px;
  border:3px solid var(--cor-dourado);text-align:center;
  width:90%;max-width:420px;
}

.titulo-form{
  font-size:1.8rem;color:var(--cor-dourado);margin-bottom:25px;
}

.rotulo{
  color:white;font-size:1.3rem;margin-bottom:12px;display:block;
}

.entrada-nome{
  width:100%;padding:14px;font-size:1.1rem;
  background:#222;color:white;border:2px solid #555;
  border-radius:8px;margin-bottom:25px;outline:none;
}
.entrada-nome:focus{border-color:var(--cor-dourado);}

.botao-continuar{
  width:100%;padding:14px;font-size:1.3rem;
  background:linear-gradient(to bottom,var(--cor-dourado),var(--cor-botao));
  color:#000;font-weight:bold;border:none;
  border-radius:8px;cursor:pointer;
  border:2px solid #000;
  transition:transform 0.2s;
}
.botao-continuar:hover{transform:scale(1.03);}
